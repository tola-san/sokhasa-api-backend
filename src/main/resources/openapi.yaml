openapi: 3.1.0
info:
  title: Sokhasa Clinic API
  version: 1.0.0
  description: REST API specification for Sokhasa Clinic Appointment Booking and CMS. Interactive reference rendered via Scalar.
servers:
  - url: /api/v1
    description: Base API v1 endpoint
paths:
  /health:
    get:
      tags:
        - System
      operationId: getHealth
      summary: Deployment and database health check
      description: Returns HTTP 200 when backend and database are healthy. Returns 503 when down.
      responses:
        '200':
          description: Application and database are healthy
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: UP
        '503':
          description: Service Unavailable

  /clinic/info:
    get:
      tags:
        - Public Clinic
      operationId: getClinicInfo
      summary: Public clinic name and welcome message
      responses:
        '200':
          description: Clinic information
          content:
            application/json:
              schema:
                type: object
                required: [name, message]
                properties:
                  name:
                    type: string
                    example: Clinic Sokhasa
                  message:
                    type: string
                    example: Welcome to Clinic Sokhasa.

  /admin/homepage/banner:
    get:
      tags:
        - Admin Homepage Banner
      security:
        - BearerAuth: []
      operationId: getAdminHomepageBanner
      summary: Get the current homepage hero banner
      description: |
        Returns the first slide of the public homepage hero photo slider in every saved language,
        and its strong ETag. Before the first publish imageUrl, fileName and publishedAt are null,
        translations is empty, missingLanguages is ["km","en","zh"] and the ETag is "0".
      responses:
        '200':
          description: Current banner
          headers:
            ETag:
              description: Strong revision tag to send in If-Match. "0" before the first publish.
              schema:
                type: string
                example: '"3"'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminBannerWrapper'
        '401':
          description: Missing or invalid bearer token
        '403':
          description: Caller lacks the ADMIN role
    patch:
      tags:
        - Admin Homepage Banner
      security:
        - BearerAuth: []
      operationId: publishHomepageBanner
      summary: Publish or update the homepage hero banner
      description: |
        Publishes immediately. Send an image, translations, or both. Languages not sent keep their
        saved text. A replacement image requires translations for km, en and zh in the same request.
        After the request, every language (km, en, zh) must have text, otherwise the request returns
        409 TRANSLATION_MISSING and nothing changes; the first publish therefore needs the image and
        all three translations. The live banner switches only after the image upload and the
        database update both succeed.
      parameters:
        - name: If-Match
          in: header
          required: true
          description: ETag from the latest GET or PATCH response.
          schema:
            type: string
            example: '"3"'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image:
                  type: string
                  format: binary
                  description: JPEG, PNG, or WebP up to 5 MiB and 40 million pixels.
                translations:
                  type: array
                  description: Sent as an application/json part. Each languageCode at most once.
                  items:
                    $ref: '#/components/schemas/BannerText'
            encoding:
              translations:
                contentType: application/json
      responses:
        '200':
          description: Banner published
          headers:
            ETag:
              description: New strong revision tag.
              schema:
                type: string
                example: '"4"'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminBannerWrapper'
        '400':
          description: |
            Invalid or duplicate languageCode, missing or invalid text field, malformed translations
            JSON, empty request, new image without all three translations, first publish without an
            image, or undecodable image (VALIDATION_ERROR)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Missing or invalid bearer token
        '403':
          description: Caller lacks the ADMIN role
        '409':
          description: A required language would be missing after the request (TRANSLATION_MISSING)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '412':
          description: If-Match does not match the current banner revision (VERSION_MISMATCH)
        '413':
          description: Image exceeds 5 MiB (IMAGE_TOO_LARGE)
        '415':
          description: Image is not JPEG, PNG, or WebP (UNSUPPORTED_IMAGE)
        '428':
          description: If-Match header is missing (VERSION_REQUIRED)
        '503':
          description: Media storage unavailable (STORAGE_UNAVAILABLE)

  /public/homepage/banner:
    get:
      tags:
        - Public Homepage Banner
      operationId: getPublicHomepageBanner
      summary: Get the published homepage hero banner in one language
      description: |
        imageUrl is a signed Cloudflare R2 URL that expires after five minutes, so responses are
        sent with Cache-Control no-store. There is no fallback to another language.
      parameters:
        - name: lang
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/LanguageCode'
      responses:
        '200':
          description: Published banner in the requested language
          headers:
            Content-Language:
              description: The language served, equal to lang.
              schema:
                $ref: '#/components/schemas/LanguageCode'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicBannerWrapper'
        '400':
          description: lang is missing or not km, en or zh (VALIDATION_ERROR)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: |
            Nothing published yet, or no text in the requested language (BANNER_NOT_FOUND); use the
            bundled first slide

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Keycloak JWT access token with ROLE_ADMIN


  schemas:
    LanguageCode:
      type: string
      enum: [km, en, zh]
      description: Khmer, English or Simplified Chinese. Exact lowercase match.

    BannerText:
      type: object
      required: [languageCode, heading, description, altText]
      properties:
        languageCode:
          $ref: '#/components/schemas/LanguageCode'
        heading:
          type: string
          minLength: 1
          maxLength: 120
          example: Your Comfort, Our Priority
        description:
          type: string
          minLength: 1
          maxLength: 300
          example: Experience gentle, personalized care designed for your peace of mind.
        altText:
          type: string
          minLength: 1
          maxLength: 200
          example: Sokhasa Clinic staff standing outside the clinic

    AdminBanner:
      type: object
      required: [imageUrl, fileName, publishedAt, translations, missingLanguages]
      properties:
        imageUrl:
          type: [string, 'null']
          format: uri
          description: Signed URL valid for five minutes. Null before the first publish.
        fileName:
          type: [string, 'null']
          example: clinic-team.webp
        publishedAt:
          type: [string, 'null']
          format: date-time
        translations:
          type: array
          description: Saved languages, ordered km, en, zh.
          items:
            $ref: '#/components/schemas/BannerText'
        missingLanguages:
          type: array
          description: Required languages with no saved text, ordered km, en, zh.
          items:
            $ref: '#/components/schemas/LanguageCode'

    AdminBannerWrapper:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/AdminBanner'

    PublicBanner:
      type: object
      required: [languageCode, imageUrl, altText, heading, description]
      properties:
        languageCode:
          $ref: '#/components/schemas/LanguageCode'
        imageUrl:
          type: string
          format: uri
          description: Signed URL valid for five minutes.
        altText:
          type: string
        heading:
          type: string
        description:
          type: string

    PublicBannerWrapper:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/PublicBanner'

    ProblemDetails:
      type: object
      properties:
        type:
          type: string
          example: VALIDATION_ERROR
        title:
          type: string
          example: Bad Request
        status:
          type: integer
          example: 400
        detail:
          type: string
          example: translations[km].heading must be at most 120 characters.
        instance:
          type: string
          example: /api/v1/admin/homepage/banner
        timestamp:
          type: string
          format: date-time
        errors:
          type: array
          description: Field-level details. For TRANSLATION_MISSING, one entry per missing language.
          items:
            type: object
            properties:
              field:
                type: string
                example: translations
              languageCode:
                $ref: '#/components/schemas/LanguageCode'
