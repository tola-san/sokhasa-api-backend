openapi: 3.1.0
info:
  title: Sokhasa Clinic API
  version: 1.0.0
  description: REST API specification for Sokhasa Clinic Appointment Booking and CMS. Interactive reference rendered via Scalar.
servers:
  - url: /api/v1
    description: Base API v1 endpoint
paths:
  /health:
    get:
      tags:
        - System
      operationId: getHealth
      summary: Deployment and database health check
      description: Returns HTTP 200 when backend and database are healthy. Returns 503 when down.
      responses:
        '200':
          description: Application and database are healthy
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: UP
        '503':
          description: Service Unavailable

  /clinic/info:
    get:
      tags:
        - Public Clinic
      operationId: getClinicInfo
      summary: Public clinic name and welcome message
      responses:
        '200':
          description: Clinic information
          content:
            application/json:
              schema:
                type: object
                required: [name, message]
                properties:
                  name:
                    type: string
                    example: Clinic Sokhasa
                  message:
                    type: string
                    example: Welcome to Clinic Sokhasa.

  /admin/homepage/banner:
    get:
      tags:
        - Admin Homepage Banner
      security:
        - BearerAuth: []
      operationId: getAdminHomepageBanner
      summary: Get the current homepage hero banner
      description: |
        Returns the first slide of the public homepage hero photo slider in every saved language,
        and its strong ETag. Before the first publish imageUrl, fileName and publishedAt are null,
        translations is empty, missingLanguages is ["km","en","zh"] and the ETag is "0".
      responses:
        '200':
          description: Current banner
          headers:
            ETag:
              description: Strong revision tag to send in If-Match. "0" before the first publish.
              schema:
                type: string
                example: '"3"'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminBannerWrapper'
        '401':
          description: Missing or invalid bearer token
        '403':
          description: Caller lacks the ADMIN role
    patch:
      tags:
        - Admin Homepage Banner
      security:
        - BearerAuth: []
      operationId: publishHomepageBanner
      summary: Publish or update the homepage hero banner
      description: |
        Publishes immediately. Send an image, translations, or both. Languages not sent keep their
        saved text. A replacement image requires translations for km, en and zh in the same request.
        After the request, every language (km, en, zh) must have text, otherwise the request returns
        409 TRANSLATION_MISSING and nothing changes; the first publish therefore needs the image and
        all three translations. The live banner switches only after the image upload and the
        database update both succeed.
      parameters:
        - name: If-Match
          in: header
          required: true
          description: ETag from the latest GET or PATCH response.
          schema:
            type: string
            example: '"3"'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image:
                  type: string
                  format: binary
                  description: JPEG, PNG, or WebP up to 5 MiB and 40 million pixels.
                translations:
                  type: array
                  description: Sent as an application/json part. Each languageCode at most once.
                  items:
                    $ref: '#/components/schemas/BannerText'
            encoding:
              translations:
                contentType: application/json
      responses:
        '200':
          description: Banner published
          headers:
            ETag:
              description: New strong revision tag.
              schema:
                type: string
                example: '"4"'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminBannerWrapper'
        '400':
          description: |
            Invalid or duplicate languageCode, missing or invalid text field, malformed translations
            JSON, empty request, new image without all three translations, first publish without an
            image, or undecodable image (VALIDATION_ERROR)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Missing or invalid bearer token
        '403':
          description: Caller lacks the ADMIN role
        '409':
          description: A required language would be missing after the request (TRANSLATION_MISSING)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '412':
          description: If-Match does not match the current banner revision (VERSION_MISMATCH)
        '413':
          description: Image exceeds 5 MiB (IMAGE_TOO_LARGE)
        '415':
          description: Image is not JPEG, PNG, or WebP (UNSUPPORTED_IMAGE)
        '428':
          description: If-Match header is missing (VERSION_REQUIRED)
        '503':
          description: Media storage unavailable (STORAGE_UNAVAILABLE)

  /public/homepage/banner:
    get:
      tags:
        - Public Homepage Banner
      operationId: getPublicHomepageBanner
      summary: Get the published homepage hero banner in one language
      description: |
        imageUrl is a signed Cloudflare R2 URL that expires after five minutes, so responses are
        sent with Cache-Control no-store. There is no fallback to another language.
      parameters:
        - name: lang
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/LanguageCode'
      responses:
        '200':
          description: Published banner in the requested language
          headers:
            Content-Language:
              description: The language served, equal to lang.
              schema:
                $ref: '#/components/schemas/LanguageCode'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicBannerWrapper'
        '400':
          description: lang is missing or not km, en or zh (VALIDATION_ERROR)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: |
            Nothing published yet, or no text in the requested language (BANNER_NOT_FOUND); use the
            bundled first slide

  /public/services:
    get:
      tags:
        - Public Services
      operationId: listPublicServices
      summary: List active bookable services in one language
      description: |
        Approved November 18, 2026. Returns every ACTIVE service, ordered by category sortOrder, service sortOrder, then slug.
        No paging and no fallback to another language. imageUrl is a signed Cloudflare R2 URL that
        expires after five minutes, so responses are sent with Cache-Control no-store.
      parameters:
        - name: lang
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/LanguageCode'
      responses:
        '200':
          description: Active services in the requested language; an empty array when there are none
          headers:
            Content-Language:
              description: The language served, equal to lang.
              schema:
                $ref: '#/components/schemas/LanguageCode'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicServiceListWrapper'
        '400':
          description: lang is missing or not km, en or zh (VALIDATION_ERROR)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /admin/services:
    get:
      tags:
        - Admin Services
      security:
        - BearerAuth: []
      operationId: listAdminServices
      summary: List every service for editing
      description: |
        Approved November 18, 2026.
        Active and inactive services with admin fields and every saved language, in public list order.
      responses:
        '200':
          description: All services
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminServiceListWrapper'
        '401':
          description: Missing or invalid bearer token
        '403':
          description: Caller lacks the ADMIN role

  /admin/services/{id}:
    parameters:
      - $ref: '#/components/parameters/ServiceId'
    get:
      tags:
        - Admin Services
      security:
        - BearerAuth: []
      operationId: getAdminService
      summary: Get one service for editing
      responses:
        '200':
          description: The service and its strong ETag
          headers:
            ETag:
              $ref: '#/components/headers/ServiceETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminServiceWrapper'
        '401':
          description: Missing or invalid bearer token
        '403':
          description: Caller lacks the ADMIN role
        '404':
          $ref: '#/components/responses/ServiceNotFound'
    put:
      tags:
        - Admin Services
      security:
        - BearerAuth: []
      operationId: updateAdminService
      summary: Update a service's text, duration, buffer, prices and order
      description: |
        Languages not sent keep their saved text. An ACTIVE service must still have km, en and zh
        afterwards, otherwise 409 TRANSLATION_MISSING and nothing changes. Slug, category, status
        and image are not changed here.
      parameters:
        - $ref: '#/components/parameters/ServiceIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminServiceUpdate'
      responses:
        '200':
          $ref: '#/components/responses/AdminServiceSaved'
        '400':
          $ref: '#/components/responses/ServiceValidationError'
        '401':
          description: Missing or invalid bearer token
        '403':
          description: Caller lacks the ADMIN role
        '404':
          $ref: '#/components/responses/ServiceNotFound'
        '409':
          $ref: '#/components/responses/ServiceTranslationMissing'
        '412':
          description: If-Match is not the current version (VERSION_MISMATCH)
        '428':
          description: If-Match header is missing (VERSION_REQUIRED)

  /admin/services/{id}/activate:
    parameters:
      - $ref: '#/components/parameters/ServiceId'
    patch:
      tags:
        - Admin Services
      security:
        - BearerAuth: []
      operationId: activateAdminService
      summary: Make a service public and bookable
      description: Requires km, en and zh text. Activating an active service changes nothing.
      parameters:
        - $ref: '#/components/parameters/ServiceIfMatch'
      responses:
        '200':
          $ref: '#/components/responses/AdminServiceSaved'
        '401':
          description: Missing or invalid bearer token
        '403':
          description: Caller lacks the ADMIN role
        '404':
          $ref: '#/components/responses/ServiceNotFound'
        '409':
          $ref: '#/components/responses/ServiceTranslationMissing'
        '412':
          description: If-Match is not the current version (VERSION_MISMATCH)
        '428':
          description: If-Match header is missing (VERSION_REQUIRED)

  /admin/services/{id}/deactivate:
    parameters:
      - $ref: '#/components/parameters/ServiceId'
    patch:
      tags:
        - Admin Services
      security:
        - BearerAuth: []
      operationId: deactivateAdminService
      summary: Hide a service from the website and booking form
      description: Existing appointments keep the service. Deactivating an inactive service changes nothing.
      parameters:
        - $ref: '#/components/parameters/ServiceIfMatch'
      responses:
        '200':
          $ref: '#/components/responses/AdminServiceSaved'
        '401':
          description: Missing or invalid bearer token
        '403':
          description: Caller lacks the ADMIN role
        '404':
          $ref: '#/components/responses/ServiceNotFound'
        '412':
          description: If-Match is not the current version (VERSION_MISMATCH)
        '428':
          description: If-Match header is missing (VERSION_REQUIRED)

  /admin/services/{id}/image:
    parameters:
      - $ref: '#/components/parameters/ServiceId'
    put:
      tags:
        - Admin Services
      security:
        - BearerAuth: []
      operationId: putAdminServiceImage
      summary: Set or replace a service image with alt text in every language
      description: |
        Approved November 18, 2026 (SI-01 to SI-07). The service needs its name and description in
        km, en and zh first. The new image is live only after the upload and the database update
        both succeed; a replaced image is deleted from storage afterwards.
      parameters:
        - $ref: '#/components/parameters/ServiceIfMatch'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image, altTexts]
              properties:
                image:
                  type: string
                  format: binary
                  description: JPEG, PNG, or WebP up to 5 MiB and 40 million pixels.
                altTexts:
                  type: array
                  minItems: 3
                  maxItems: 3
                  description: Sent as an application/json part. One entry per km, en and zh.
                  items:
                    $ref: '#/components/schemas/ServiceImageAltText'
            encoding:
              altTexts:
                contentType: application/json
      responses:
        '200':
          $ref: '#/components/responses/AdminServiceSaved'
        '400':
          $ref: '#/components/responses/ServiceValidationError'
        '401':
          description: Missing or invalid bearer token
        '403':
          description: Caller lacks the ADMIN role
        '404':
          $ref: '#/components/responses/ServiceNotFound'
        '409':
          $ref: '#/components/responses/ServiceTranslationMissing'
        '412':
          description: If-Match is not the current version (VERSION_MISMATCH)
        '413':
          description: Image exceeds 5 MiB (IMAGE_TOO_LARGE)
        '415':
          description: Image is not JPEG, PNG, or WebP (UNSUPPORTED_IMAGE)
        '428':
          description: If-Match header is missing (VERSION_REQUIRED)
        '503':
          description: Media storage unavailable (STORAGE_UNAVAILABLE)
    delete:
      tags:
        - Admin Services
      security:
        - BearerAuth: []
      operationId: deleteAdminServiceImage
      summary: Remove a service image and its alt text
      description: The website falls back to its bundled picture. Deleting when there is no image changes nothing.
      parameters:
        - $ref: '#/components/parameters/ServiceIfMatch'
      responses:
        '200':
          $ref: '#/components/responses/AdminServiceSaved'
        '401':
          description: Missing or invalid bearer token
        '403':
          description: Caller lacks the ADMIN role
        '404':
          $ref: '#/components/responses/ServiceNotFound'
        '412':
          description: If-Match is not the current version (VERSION_MISMATCH)
        '428':
          description: If-Match header is missing (VERSION_REQUIRED)

  /public/booking-periods:
    get:
      tags:
        - Public Booking
      operationId: getBookingPeriods
      summary: Periods on a date and whether a service still fits (AP-11)
      description: |
        A hint for the booking form; the booking request checks capacity again under a lock. A date
        outside the booking window returns every period with available false.
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
            example: '2026-11-20'
        - name: serviceId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Each period with its hours and availability
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/BookingPeriodAvailability'
        '400':
          $ref: '#/components/responses/AppointmentValidationError'
        '404':
          $ref: '#/components/responses/AppointmentProblem'

  /public/appointments:
    post:
      tags:
        - Public Booking
      operationId: createAppointment
      summary: Submit a booking request; starts as PENDING
      description: |
        Requires an Idempotency-Key (AP-03): the same key and body return the first response; the
        same key with a different body returns 409 IDEMPOTENCY_CONFLICT. The period must have
        capacity left (409 PERIOD_FULL). At most 5 requests per client per 10 minutes (AP-12).
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingRequest'
      responses:
        '201':
          description: The request was created, or this key's first request is returned again
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/BookingConfirmation'
        '400':
          $ref: '#/components/responses/AppointmentValidationError'
        '404':
          description: Unknown or inactive service (SERVICE_NOT_FOUND)
        '409':
          description: PERIOD_FULL or IDEMPOTENCY_CONFLICT
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '428':
          description: Idempotency-Key is missing (IDEMPOTENCY_KEY_REQUIRED)
        '429':
          description: Too many booking requests from this client (RATE_LIMITED)

  /admin/appointments:
    get:
      tags:
        - Reception
      security:
        - BearerAuth: []
      operationId: listAppointments
      summary: List, filter and search appointments, oldest request first
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/AppointmentStatus'
        - name: date
          in: query
          description: The confirmed date, or the preferred date until confirmed. Not combined with from and to.
          schema:
            type: string
            format: date
        - name: from
          in: query
          description: Start of an inclusive range on the same date (AP-15). Needs to; at most 62 days.
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
        - name: q
          in: query
          description: Reference, patient name or phone number in any format.
          schema:
            type: string
            maxLength: 100
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: One page of appointments
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AppointmentListItem'
                  page:
                    $ref: '#/components/schemas/PageInfo'
        '400':
          $ref: '#/components/responses/AppointmentValidationError'
        '401':
          description: Missing or invalid bearer token
        '403':
          description: Caller has neither the ADMIN nor the RECEPTION role

  /admin/appointments/{id}:
    parameters:
      - $ref: '#/components/parameters/AppointmentId'
    get:
      tags:
        - Reception
      security:
        - BearerAuth: []
      operationId: getAppointment
      summary: One appointment and its strong ETag
      responses:
        '200':
          $ref: '#/components/responses/AppointmentSaved'
        '401':
          description: Missing or invalid bearer token
        '403':
          description: Caller has neither the ADMIN nor the RECEPTION role
        '404':
          $ref: '#/components/responses/AppointmentProblem'

  /admin/appointments/{id}/history:
    parameters:
      - $ref: '#/components/parameters/AppointmentId'
    get:
      tags:
        - Reception
      security:
        - BearerAuth: []
      operationId: getAppointmentHistory
      summary: Status changes, oldest first
      responses:
        '200':
          description: Who changed the status, when, from, to and why
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/StatusChange'
        '404':
          $ref: '#/components/responses/AppointmentProblem'

  /admin/appointments/{id}/confirm:
    parameters:
      - $ref: '#/components/parameters/AppointmentId'
    patch:
      tags:
        - Reception
      security:
        - BearerAuth: []
      operationId: confirmAppointment
      summary: PENDING → CONFIRMED with doctor and exact time
      description: |
        The appointment, buffer included, must fit inside one period (400 on startTime). A doctor
        cannot have overlapping active appointments (409 DOCTOR_UNAVAILABLE). Checks run in order:
        404, If-Match (428, 412), transition (409 INVALID_TRANSITION), then the body.
      parameters:
        - $ref: '#/components/parameters/AppointmentIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmRequest'
      responses:
        '200':
          $ref: '#/components/responses/AppointmentSaved'
        '400':
          $ref: '#/components/responses/AppointmentValidationError'
        '404':
          description: APPOINTMENT_NOT_FOUND or DOCTOR_NOT_FOUND
        '409':
          description: INVALID_TRANSITION or DOCTOR_UNAVAILABLE
        '412':
          description: If-Match is not the current version (VERSION_MISMATCH)
        '428':
          description: If-Match is missing (VERSION_REQUIRED)

  /admin/appointments/{id}/reject:
    parameters:
      - $ref: '#/components/parameters/AppointmentId'
    patch:
      tags:
        - Reception
      security:
        - BearerAuth: []
      operationId: rejectAppointment
      summary: PENDING → REJECTED with a reason
      parameters:
        - $ref: '#/components/parameters/AppointmentIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectRequest'
      responses:
        '200':
          $ref: '#/components/responses/AppointmentSaved'
        '400':
          $ref: '#/components/responses/AppointmentValidationError'
        '404':
          $ref: '#/components/responses/AppointmentProblem'
        '409':
          description: INVALID_TRANSITION
        '412':
          description: VERSION_MISMATCH
        '428':
          description: VERSION_REQUIRED

  /admin/appointments/{id}/arrive:
    parameters:
      - $ref: '#/components/parameters/AppointmentId'
    patch:
      tags:
        - Reception
      security:
        - BearerAuth: []
      operationId: arriveAppointment
      summary: CONFIRMED → ARRIVED
      parameters:
        - $ref: '#/components/parameters/AppointmentIfMatch'
      responses:
        '200':
          $ref: '#/components/responses/AppointmentSaved'
        '404':
          $ref: '#/components/responses/AppointmentProblem'
        '409':
          description: INVALID_TRANSITION
        '412':
          description: VERSION_MISMATCH
        '428':
          description: VERSION_REQUIRED

  /admin/appointments/{id}/start:
    parameters:
      - $ref: '#/components/parameters/AppointmentId'
    patch:
      tags:
        - Reception
      security:
        - BearerAuth: []
      operationId: startAppointment
      summary: ARRIVED → IN_PROGRESS
      parameters:
        - $ref: '#/components/parameters/AppointmentIfMatch'
      responses:
        '200':
          $ref: '#/components/responses/AppointmentSaved'
        '404':
          $ref: '#/components/responses/AppointmentProblem'
        '409':
          description: INVALID_TRANSITION
        '412':
          description: VERSION_MISMATCH
        '428':
          description: VERSION_REQUIRED

  /admin/appointments/{id}/complete:
    parameters:
      - $ref: '#/components/parameters/AppointmentId'
    patch:
      tags:
        - Reception
      security:
        - BearerAuth: []
      operationId: completeAppointment
      summary: IN_PROGRESS → COMPLETED
      parameters:
        - $ref: '#/components/parameters/AppointmentIfMatch'
      responses:
        '200':
          $ref: '#/components/responses/AppointmentSaved'
        '404':
          $ref: '#/components/responses/AppointmentProblem'
        '409':
          description: INVALID_TRANSITION
        '412':
          description: VERSION_MISMATCH
        '428':
          description: VERSION_REQUIRED

  /admin/dashboard/summary:
    get:
      tags:
        - Reception
      security:
        - BearerAuth: []
      operationId: getDashboardSummary
      summary: Pending requests and today's appointments by status
      responses:
        '200':
          description: Counts; today is the current clinic date
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      pending:
                        type: integer
                        example: 4
                      today:
                        type: object
                        additionalProperties:
                          type: integer
                        example:
                          CONFIRMED: 6
                          COMPLETED: 3

  /admin/doctors:
    get:
      tags:
        - Reception
      security:
        - BearerAuth: []
      operationId: listDoctors
      summary: Active doctors for the confirm dialog (AP-16)
      responses:
        '200':
          description: Active doctors in display order
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        fullName:
                          type: string

components:
  parameters:
    AppointmentId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AppointmentIfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag from the latest GET or change response.
      schema:
        type: string
        example: '"2"'
    ServiceId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ServiceIfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag from the latest GET or write response.
      schema:
        type: string
        example: '"3"'

  headers:
    ServiceETag:
      description: Strong version tag to send in If-Match.
      schema:
        type: string
        example: '"3"'

  responses:
    AppointmentSaved:
      description: The appointment and its strong ETag
      headers:
        ETag:
          description: Strong version tag to send in If-Match.
          schema:
            type: string
            example: '"2"'
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: '#/components/schemas/AppointmentDetail'
    AppointmentProblem:
      description: Not found (APPOINTMENT_NOT_FOUND or SERVICE_NOT_FOUND)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    AppointmentValidationError:
      description: Missing or invalid fields (VALIDATION_ERROR); errors[].field names each one
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    AdminServiceSaved:
      description: Saved service and its new ETag
      headers:
        ETag:
          $ref: '#/components/headers/ServiceETag'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminServiceWrapper'
    ServiceNotFound:
      description: Unknown or malformed id (SERVICE_NOT_FOUND)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ServiceValidationError:
      description: Invalid field, duplicate or unknown languageCode, malformed JSON, or imageAltText sent (VALIDATION_ERROR)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ServiceTranslationMissing:
      description: An active service would be missing a language (TRANSLATION_MISSING)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Keycloak JWT access token with ROLE_ADMIN


  schemas:
    LanguageCode:
      type: string
      enum: [km, en, zh]
      description: Khmer, English or Simplified Chinese. Exact lowercase match.

    BannerText:
      type: object
      required: [languageCode, heading, description, altText]
      properties:
        languageCode:
          $ref: '#/components/schemas/LanguageCode'
        heading:
          type: string
          minLength: 1
          maxLength: 120
          example: Your Comfort, Our Priority
        description:
          type: string
          minLength: 1
          maxLength: 300
          example: Experience gentle, personalized care designed for your peace of mind.
        altText:
          type: string
          minLength: 1
          maxLength: 200
          example: Sokhasa Clinic staff standing outside the clinic

    AdminBanner:
      type: object
      required: [imageUrl, fileName, publishedAt, translations, missingLanguages]
      properties:
        imageUrl:
          type: [string, 'null']
          format: uri
          description: Signed URL valid for five minutes. Null before the first publish.
        fileName:
          type: [string, 'null']
          example: clinic-team.webp
        publishedAt:
          type: [string, 'null']
          format: date-time
        translations:
          type: array
          description: Saved languages, ordered km, en, zh.
          items:
            $ref: '#/components/schemas/BannerText'
        missingLanguages:
          type: array
          description: Required languages with no saved text, ordered km, en, zh.
          items:
            $ref: '#/components/schemas/LanguageCode'

    AdminBannerWrapper:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/AdminBanner'

    PublicBanner:
      type: object
      required: [languageCode, imageUrl, altText, heading, description]
      properties:
        languageCode:
          $ref: '#/components/schemas/LanguageCode'
        imageUrl:
          type: string
          format: uri
          description: Signed URL valid for five minutes.
        altText:
          type: string
        heading:
          type: string
        description:
          type: string

    PublicBannerWrapper:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/PublicBanner'

    PublicService:
      type: object
      required:
        - id
        - slug
        - categorySlug
        - categoryName
        - name
        - shortDescription
        - durationMinutes
        - priceUsd
        - originalPriceUsd
        - imageUrl
        - imageAltText
      properties:
        id:
          type: string
          format: uuid
          description: Send as serviceId when booking.
        slug:
          type: string
          example: colonoscopy
        categorySlug:
          type: string
          example: digestive-health
        categoryName:
          type: string
          example: Digestive Health
        name:
          type: string
          minLength: 1
          maxLength: 120
          example: Colonoscopy
        shortDescription:
          type: string
          minLength: 1
          maxLength: 300
          example: Camera examination of the large intestine.
        durationMinutes:
          type: integer
          minimum: 5
          maximum: 480
          example: 60
        priceUsd:
          type: [number, 'null']
          minimum: 0
          multipleOf: 0.01
          description: US dollars. Null means ask the clinic for the price.
          example: 450.00
        originalPriceUsd:
          type: [number, 'null']
          multipleOf: 0.01
          description: Price before a promotion. Only set when priceUsd is set, and greater than it.
          example: null
        imageUrl:
          type: [string, 'null']
          format: uri
          description: Signed URL valid for five minutes. Null when the service has no image.
        imageAltText:
          type: [string, 'null']
          minLength: 1
          maxLength: 200
          description: Null exactly when imageUrl is null.
          example: Colonoscopy package poster

    PublicServiceListWrapper:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PublicService'

    ServiceStatus:
      type: string
      enum: [ACTIVE, INACTIVE]

    AdminServiceText:
      type: object
      required: [languageCode, name, shortDescription]
      properties:
        languageCode:
          $ref: '#/components/schemas/LanguageCode'
        name:
          type: string
          minLength: 1
          maxLength: 120
        shortDescription:
          type: string
          minLength: 1
          maxLength: 300
        imageAltText:
          type: [string, 'null']
          maxLength: 200
          description: |
            Alt text of the service image in this language (SI-06). In PUT requests, absent or null
            keeps the saved value; a value is only allowed when the service has an image.

    ServiceImageAltText:
      type: object
      required: [languageCode, imageAltText]
      properties:
        languageCode:
          $ref: '#/components/schemas/LanguageCode'
        imageAltText:
          type: string
          minLength: 1
          maxLength: 200

    AdminService:
      type: object
      required:
        - id
        - slug
        - categorySlug
        - categoryName
        - status
        - durationMinutes
        - bufferMinutes
        - priceUsd
        - originalPriceUsd
        - sortOrder
        - imageUrl
        - updatedAt
        - version
        - translations
        - missingLanguages
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        categorySlug:
          type: string
        categoryName:
          type: string
          description: English category name.
        status:
          $ref: '#/components/schemas/ServiceStatus'
        durationMinutes:
          type: integer
          minimum: 5
          maximum: 480
        bufferMinutes:
          type: integer
          minimum: 0
          maximum: 60
        priceUsd:
          type: [number, 'null']
        originalPriceUsd:
          type: [number, 'null']
        sortOrder:
          type: integer
        imageUrl:
          type: [string, 'null']
          format: uri
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          description: Same value as the ETag, without quotes.
        translations:
          type: array
          description: Saved languages, ordered km, en, zh.
          items:
            $ref: '#/components/schemas/AdminServiceText'
        missingLanguages:
          type: array
          items:
            $ref: '#/components/schemas/LanguageCode'

    AdminServiceWrapper:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/AdminService'

    AdminServiceListWrapper:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AdminService'

    AdminServiceUpdate:
      type: object
      required: [durationMinutes, bufferMinutes, priceUsd, originalPriceUsd, sortOrder]
      properties:
        durationMinutes:
          type: integer
          minimum: 5
          maximum: 480
        bufferMinutes:
          type: integer
          minimum: 0
          maximum: 60
        priceUsd:
          type: [number, 'null']
          minimum: 0
          multipleOf: 0.01
        originalPriceUsd:
          type: [number, 'null']
          multipleOf: 0.01
          description: Null, or greater than priceUsd. Requires priceUsd.
        sortOrder:
          type: integer
          minimum: 0
          maximum: 9999
        translations:
          type: array
          maxItems: 3
          description: Each languageCode at most once. Languages not sent keep their saved text.
          items:
            $ref: '#/components/schemas/AdminServiceText'

    ProblemDetails:
      type: object
      properties:
        type:
          type: string
          example: VALIDATION_ERROR
        title:
          type: string
          example: Bad Request
        status:
          type: integer
          example: 400
        detail:
          type: string
          example: translations[km].heading must be at most 120 characters.
        instance:
          type: string
          example: /api/v1/admin/homepage/banner
        timestamp:
          type: string
          format: date-time
        errors:
          type: array
          description: Field-level details. For TRANSLATION_MISSING, one entry per missing language.
          items:
            type: object
            properties:
              field:
                type: string
                example: translations
              languageCode:
                $ref: '#/components/schemas/LanguageCode'

    AppointmentStatus:
      type: string
      enum: [PENDING, CONFIRMED, REJECTED, ARRIVED, IN_PROGRESS, COMPLETED]

    BookingPeriodAvailability:
      type: object
      required: [code, startTime, endTime, available]
      properties:
        code:
          type: string
          example: MORNING
        startTime:
          type: string
          example: '08:00'
        endTime:
          type: string
          example: '12:00'
        available:
          type: boolean

    BookingRequest:
      type: object
      required: [serviceId, preferredDate, preferredPeriod, language, patient]
      properties:
        serviceId:
          type: string
          format: uuid
        preferredDate:
          type: string
          format: date
          description: Today to today + 60 days in clinic time (AP-02).
        preferredPeriod:
          type: string
          example: MORNING
        language:
          $ref: '#/components/schemas/LanguageCode'
        patient:
          type: object
          required: [fullName, phone]
          properties:
            fullName:
              type: string
              maxLength: 120
              example: Sok Dara
            phone:
              type: string
              description: Any common format; stored as E.164 (AP-04).
              example: 012 345 678
            email:
              type: [string, 'null']
              maxLength: 254
        notes:
          type: [string, 'null']
          maxLength: 500

    BookingConfirmation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        reference:
          type: string
          example: SK-20261120-0007
        status:
          $ref: '#/components/schemas/AppointmentStatus'
        preferredDate:
          type: string
          format: date
        preferredPeriod:
          type: string
          example: MORNING

    AppointmentListItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        reference:
          type: string
          example: SK-20261120-0007
        status:
          $ref: '#/components/schemas/AppointmentStatus'
        patientName:
          type: string
        patientPhone:
          type: string
          example: '+85512345678'
        serviceName:
          type: string
          description: In English, the staff language.
        preferredDate:
          type: string
          format: date
        preferredPeriod:
          type: string
        doctorName:
          type: [string, 'null']
        startAt:
          type: [string, 'null']
          format: date-time
          example: '2026-11-20T09:30:00+07:00'
        createdAt:
          type: string
          format: date-time

    AppointmentDetail:
      allOf:
        - $ref: '#/components/schemas/AppointmentListItem'
        - type: object
          properties:
            serviceId:
              type: string
              format: uuid
            patientEmail:
              type: [string, 'null']
            language:
              $ref: '#/components/schemas/LanguageCode'
            notes:
              type: [string, 'null']
            durationMinutes:
              type: integer
            bufferMinutes:
              type: integer
            doctorId:
              type: [string, 'null']
              format: uuid
            endAt:
              type: [string, 'null']
              format: date-time
            updatedAt:
              type: string
              format: date-time

    PageInfo:
      type: object
      properties:
        number:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
        totalPages:
          type: integer

    StatusChange:
      type: object
      properties:
        fromStatus:
          oneOf:
            - $ref: '#/components/schemas/AppointmentStatus'
            - type: 'null'
        toStatus:
          $ref: '#/components/schemas/AppointmentStatus'
        actorType:
          type: string
          enum: [GUEST, STAFF]
        actorName:
          type: [string, 'null']
        reason:
          type: [string, 'null']
        changedAt:
          type: string
          format: date-time

    ConfirmRequest:
      type: object
      required: [doctorId, date, startTime]
      properties:
        doctorId:
          type: string
          format: uuid
        date:
          type: string
          format: date
          description: Local clinic date; may differ from the patient's preference.
        startTime:
          type: string
          example: '09:30'
          description: Local clinic time.
        durationMinutes:
          type: integer
          minimum: 5
          maximum: 480
          description: Defaults to the duration copied from the service (BK-06).

    RejectRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
