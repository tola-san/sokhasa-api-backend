spring:
  application:
    name: clinic-backend
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  jackson:
    serialization:
      write-dates-as-timestamps: false
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_schema: clinic
  security:
    oauth2:
      resourceserver:
        jwt:
          audiences:
            - sokhasa-api

server:
  port: "${PORT:8080}"

telegram:
  enabled: "${TELEGRAM_ENABLED:false}"
  bot-token: "${TELEGRAM_BOT_TOKEN:}"
  chat-id: "${TELEGRAM_CHAT_ID:}"
  retry:
    max-attempts: "${TELEGRAM_RETRY_MAX_ATTEMPTS:5}"
  worker:
    interval-ms: 10000

management:
  endpoints:
    web:
      base-path: /api/v1
      exposure:
        include: health
      discovery:
        enabled: false
  endpoint:
    health:
      show-details: never
      show-components: never

logging:
  level:
    com.sokhasaclinic.clinicbackend: INFO
