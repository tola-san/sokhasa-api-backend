spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  application:
    name: clinic-backend
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_schema: clinic
  security:
    oauth2:
      resourceserver:
        jwt:
          audiences:
            - sokhasa-api

server:
  port: "${PORT:8080}"

clinic:
  telegram:
    enabled: ${TELEGRAM_ENABLED:false}
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    chat-id: "${TELEGRAM_CHAT_ID:}"
    retry-max-attempts: ${TELEGRAM_RETRY_MAX_ATTEMPTS:5}

management:
  endpoints:
    web:
      base-path: /api/v1
      exposure:
        include: health
      discovery:
        enabled: false
  endpoint:
    health:
      show-details: never
      show-components: never

logging:
  level:
#
    com.sokhasaclinic.clinicbackend: DEBUG
