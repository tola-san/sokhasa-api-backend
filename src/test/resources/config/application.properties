# Test-only datasource pool limits. Loaded in addition to src/main/resources/application.yaml.
#
# Each PostgreSQL test class registers its own @DynamicPropertySource, so Spring caches one
# application context, and one Hikari pool, per class. With Hikari's default of 10 connections,
# 15 cached contexts can hold 150 connections and exhaust PostgreSQL's default max_connections (100)
# in CI ("too many clients already"). The concurrency tests need at most 3 connections at once
# (two worker threads and the test thread), so 4 is enough. Idle connections in cached contexts
# that are no longer in use are closed after 10 seconds.
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=10000
