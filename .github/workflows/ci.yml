name: Backend CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Maven verify
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: clinic_test
          POSTGRES_USER: clinic_ci
          POSTGRES_PASSWORD: clinic_ci
        ports:
          - 5432/tcp
        options: >-
          --health-cmd="pg_isready -h 127.0.0.1 -U clinic_ci -d clinic_test"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://127.0.0.1:${{ job.services.postgres.ports[5432] }}/clinic_test
          SPRING_DATASOURCE_USERNAME: clinic_ci
          SPRING_DATASOURCE_PASSWORD: clinic_ci
        run: bash ./mvnw --batch-mode --no-transfer-progress verify

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag sokhasa-api-backend:ci .
