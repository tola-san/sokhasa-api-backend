        - BearerAuth: []
      operationId: listDoctorBookingWindows
      summary: List working windows in a date range of at most 62 days
      description: ADMIN only. Times use Asia/Phnom_Penh. Responses use Cache-Control no-store.
      parameters:
        - $ref: '#/components/parameters/DoctorId'
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: serviceId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Doctor management response
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DoctorBookingWindow'
        '400':
          description: Invalid fields, date range or time interval
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Sign-in required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Clinic Admin required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: DOCTOR_NOT_FOUND, BOOKING_WINDOW_NOT_FOUND or SERVICE_NOT_FOUND
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: SCHEDULE_IN_USE, DOCTOR_IN_USE or BOOKING_WINDOW_OVERLAP
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    post:
      tags: [Doctor Management]
      security:
        - BearerAuth: []
      operationId: createDoctorBookingWindow
      summary: Create a verified service working window
      description: ADMIN only. Times use Asia/Phnom_Penh. Responses use Cache-Control no-store.
      parameters:
        - $ref: '#/components/parameters/DoctorId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DoctorBookingWindowWrite'
      responses:
        '201':
          description: Created resource
          headers:
            ETag:
              $ref: '#/components/headers/ServiceETag'
            Location:
              schema:
                type: string
              description: Detail URL for the created resource.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/DoctorBookingWindow'
        '400':
          description: Invalid fields, date range or time interval
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Sign-in required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Clinic Admin required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: DOCTOR_NOT_FOUND, BOOKING_WINDOW_NOT_FOUND or SERVICE_NOT_FOUND
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: SCHEDULE_IN_USE, DOCTOR_IN_USE or BOOKING_WINDOW_OVERLAP
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

