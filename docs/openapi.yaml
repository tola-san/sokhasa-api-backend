  /public/booking-slots:
    get:
      tags: [Public Booking]
      operationId: getBookingSlots
      summary: Available exact starts on a 30-minute grid in clinic time
      description: |
        Requires clinic-verified doctor/service/date windows. Returns available starts only,
        sorted and deduplicated. Duration and buffer follow the service. Pending exact requests
        reserve a doctor; unresolved legacy pending period requests block exact availability
        for that date and period across services. Availability is a hint, rechecked on submission.
        Responses use Cache-Control no-store.
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: serviceId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Available starts; an empty list when no verified availability remains
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/BookingSlots'
        '400':
          $ref: '#/components/responses/AppointmentValidationError'
        '404':
          $ref: '#/components/responses/AppointmentProblem'

  /public/booking-periods:
    get:
      tags:
        - Public Booking
      operationId: getBookingPeriods
      summary: Periods on a date and whether a service or package still fits (AP-11, PK-08)
      description: |
        A hint for the booking form; the booking request checks capacity again under a lock. A date
        outside the booking window returns every period with available false.
        Send exactly one of serviceId or packageId; both or neither is 400 VALIDATION_ERROR.
        An unknown or inactive package is 404 PACKAGE_NOT_FOUND.
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
            example: '2026-11-20'
        - name: serviceId
          in: query
          required: false
          description: Required unless packageId is sent.
          schema:
            type: string
            format: uuid
        - name: packageId
          in: query
          required: false
          description: Required unless serviceId is sent (PK-07).
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Each period with its hours and availability
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/BookingPeriodAvailability'
        '400':
          $ref: '#/components/responses/AppointmentValidationError'
        '404':
          $ref: '#/components/responses/AppointmentProblem'

  /public/appointments:
    post:
      tags:
        - Public Booking
      operationId: createAppointment
      summary: Submit a booking request; starts as PENDING
      description: |
        Requires an Idempotency-Key (AP-03): the same key and body return the first response; the
        same key with a different body returns 409 IDEMPOTENCY_CONFLICT. The period must have
        capacity left (409 PERIOD_FULL). At most 5 requests per client per 10 minutes (AP-12).
        Send exactly one of preferredPeriod or preferredStartTime. Exact requests atomically reserve
        an eligible doctor interval, buffer included; conflicts return 409 SLOT_UNAVAILABLE.
        All requests still start as PENDING and require reception approval.
        Send exactly one of serviceId or packageId (PK-07). Package requests use preferredPeriod
        only; the appointment copies the package's duration and buffer (PK-03).
        Optional preferredDoctorSlug (PD-01 to PD-05, November 20, 2026) names a public doctor
        linked to the service as a non-binding preference; reception still assigns the doctor.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingRequest'
      responses:
        '201':
          description: The request was created, or this key's first request is returned again
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/BookingConfirmation'
        '400':
          $ref: '#/components/responses/AppointmentValidationError'
        '404':
          description: Unknown or inactive service (SERVICE_NOT_FOUND) or package (PACKAGE_NOT_FOUND), or a preferredDoctorSlug that is unknown or not public (DOCTOR_NOT_FOUND, PD-02)
        '409':
          description: PERIOD_FULL, SLOT_UNAVAILABLE or IDEMPOTENCY_CONFLICT
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '428':
          description: Idempotency-Key is missing (IDEMPOTENCY_KEY_REQUIRED)
        '429':
          description: Too many booking requests from this client (RATE_LIMITED)

  /telegram/webhook:
    post:
      tags:
        - Telegram
      operationId: receiveTelegramUpdate
      summary: Telegram bot updates for patient opt-in (PT-03)
      description: |
        Called only by Telegram, registered with setWebhook. Handles /start <code>, /start and /stop
        in private chats; every other authenticated update is acknowledged with 200 and ignored.
        Replies to the patient go through the notification outbox, not this response.
      parameters:
        - name: X-Telegram-Bot-Api-Secret-Token
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: A Telegram Update object.
      responses:
        '200':
          description: Update accepted (handled or ignored)
        '401':
          description: Secret header missing or wrong (UNAUTHORIZED)
        '404':
          description: Patient updates are disabled (PT-12)

