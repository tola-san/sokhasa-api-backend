      operationId: confirmAppointment
      summary: PENDING → CONFIRMED with doctor and exact time
      description: |
        The appointment, buffer included, must fit inside one period (400 on startTime). A doctor
        cannot have overlapping active appointments (409 DOCTOR_UNAVAILABLE). Checks run in order:
