      security:
        - BearerAuth: []
      operationId: createAdminPackage
      summary: Create a package; it starts INACTIVE (PK-01)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminPackageWrite'
      responses:
        '201':
          description: The created package and ETag "0"
          headers:
            Location:
              schema:
                type: string
            ETag:
              $ref: '#/components/headers/PackageETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPackageWrapper'
        '400':
          $ref: '#/components/responses/PackageValidationError'
        '401':
          description: Missing or invalid bearer token
        '403':
          description: Caller lacks the ADMIN role
        '404':
          description: An includedServiceIds entry does not exist (SERVICE_NOT_FOUND)
        '409':
          description: Another package has the slug (PACKAGE_SLUG_TAKEN)

  /admin/packages/{id}:
    parameters:
      - $ref: '#/components/parameters/PackageId'
    get:
      tags: [Admin Packages]
      security:
        - BearerAuth: []
      operationId: getAdminPackage
      summary: Get one package for editing
      responses:
        '200':
          $ref: '#/components/responses/AdminPackageSaved'
        '401':
          description: Missing or invalid bearer token
        '403':
          description: Caller lacks the ADMIN role
        '404':
          $ref: '#/components/responses/PackageNotFound'
    put:
      tags: [Admin Packages]
      security:
        - BearerAuth: []
      operationId: updateAdminPackage
      summary: Replace a package's fields and included services
      description: |
        Languages not sent keep their saved text. An ACTIVE package must still have km, en and zh
        afterwards, otherwise 409 TRANSLATION_MISSING. Existing appointments keep their copied
        duration and buffer (PK-03). Status is changed only by activate and deactivate.
      parameters:
        - $ref: '#/components/parameters/PackageIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminPackageWrite'
      responses:
        '200':
          $ref: '#/components/responses/AdminPackageSaved'
        '400':
          $ref: '#/components/responses/PackageValidationError'
        '401':
          description: Missing or invalid bearer token
        '403':
          description: Caller lacks the ADMIN role
        '404':
          description: Unknown package (PACKAGE_NOT_FOUND) or included service (SERVICE_NOT_FOUND)
        '409':
          description: PACKAGE_SLUG_TAKEN or TRANSLATION_MISSING
        '412':
          description: If-Match is not the current version (VERSION_MISMATCH)
        '428':
          description: If-Match header is missing (VERSION_REQUIRED)

  /admin/packages/{id}/activate:
