components:
  parameters:
    DoctorId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BookingWindowId:
      name: windowId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AppointmentId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AppointmentIfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag from the latest GET or change response.
      schema:
        type: string
        example: '"2"'
    ServiceId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ServiceIfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag from the latest GET or write response.
      schema:
        type: string
        example: '"3"'
    PackageId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PackageIfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag from the latest GET or write response.
      schema:
        type: string
        example: '"1"'

  headers:
    ServiceETag:
      description: Strong version tag to send in If-Match.
      schema:
        type: string
        example: '"3"'
    PackageETag:
      description: Strong version tag to send in If-Match.
      schema:
        type: string
        example: '"1"'

  responses:
    AppointmentSaved:
      description: The appointment and its strong ETag
      headers:
        ETag:
          description: Strong version tag to send in If-Match.
          schema:
            type: string
            example: '"2"'
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: '#/components/schemas/AppointmentDetail'
    AppointmentProblem:
      description: Not found (APPOINTMENT_NOT_FOUND or SERVICE_NOT_FOUND)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    AppointmentValidationError:
      description: Missing or invalid fields (VALIDATION_ERROR); errors[].field names each one
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    AdminServiceSaved:
      description: Saved service and its new ETag
      headers:
        ETag:
          $ref: '#/components/headers/ServiceETag'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminServiceWrapper'
    ServiceNotFound:
      description: Unknown or malformed id (SERVICE_NOT_FOUND)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ServiceValidationError:
      description: Invalid field, duplicate or unknown languageCode, malformed JSON, or imageAltText sent (VALIDATION_ERROR)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ServiceTranslationMissing:
      description: An active service would be missing a language (TRANSLATION_MISSING)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    AdminPackageSaved:
      description: The package and its strong ETag
      headers:
        ETag:
          $ref: '#/components/headers/PackageETag'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminPackageWrapper'
    PackageNotFound:
      description: Unknown or inactive package slug (public), or unknown package id (admin) (PACKAGE_NOT_FOUND)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    PackageValidationError:
      description: Invalid field, duplicate languageCode, or bad includedServiceIds (VALIDATION_ERROR)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Keycloak JWT access token with ROLE_ADMIN


  schemas:

    DoctorWrite:
      type: object
      required: [fullName, status, sortOrder]
      properties:
        fullName:
          type: string
          minLength: 1
          maxLength: 120
          example: Dr. Sok
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
        sortOrder:
          type: integer
          minimum: 0

    ManagedDoctor:
      allOf:
        - $ref: '#/components/schemas/DoctorWrite'
        - type: object
          required: [id, version, createdAt, updatedAt]
          properties:
            id:
              type: string
              format: uuid
            version:
              type: integer
              format: int64
              minimum: 0
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time

    DoctorBookingWindowWrite:
      type: object
      required: [serviceId, date, startTime, endTime]
      description: Active doctor/service; within booking date window; duration plus buffer must fit. Same-service working windows cannot overlap. Used windows are immutable.
      properties:
        serviceId:
          type: string
          format: uuid
        date:
          type: string
          format: date
          example: '2026-11-21'
        startTime:
          type: string
          pattern: '^(?:[01][0-9]|2[0-3]):[0-5][0-9]$'
          example: '14:00'
        endTime:
          type: string
          pattern: '^(?:[01][0-9]|2[0-3]):[0-5][0-9]$'
          example: '17:00'

    DoctorBookingWindow:
      allOf:
        - $ref: '#/components/schemas/DoctorBookingWindowWrite'
        - type: object
          required: [id, doctorId, version]
          properties:
            id:
              type: string
              format: uuid
            doctorId:
              type: string
              format: uuid
            version:
              type: integer
              format: int64
              minimum: 0

    LanguageCode:
      type: string
      enum: [km, en, zh]
      description: Khmer, English or Simplified Chinese. Exact lowercase match.

    BannerText:
      type: object
      required: [languageCode, heading, description, altText]
      properties:
        languageCode:
          $ref: '#/components/schemas/LanguageCode'
        heading:
          type: string
          minLength: 1
          maxLength: 120
          example: Your Comfort, Our Priority
        description:
          type: string
          minLength: 1
          maxLength: 300
          example: Experience gentle, personalized care designed for your peace of mind.
        altText:
          type: string
          minLength: 1
          maxLength: 200
          example: Sokhasa Clinic staff standing outside the clinic

    AdminBanner:
      type: object
      required: [imageUrl, fileName, publishedAt, translations, missingLanguages]
      properties:
        imageUrl:
          type: [string, 'null']
          format: uri
          description: Signed URL valid for five minutes. Null before the first publish.
        fileName:
          type: [string, 'null']
          example: clinic-team.webp
        publishedAt:
          type: [string, 'null']
          format: date-time
        translations:
          type: array
          description: Saved languages, ordered km, en, zh.
          items:
            $ref: '#/components/schemas/BannerText'
        missingLanguages:
          type: array
          description: Required languages with no saved text, ordered km, en, zh.
          items:
            $ref: '#/components/schemas/LanguageCode'

    AdminBannerWrapper:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/AdminBanner'

    PublicBanner:
      type: object
      required: [languageCode, imageUrl, altText, heading, description]
      properties:
        languageCode:
          $ref: '#/components/schemas/LanguageCode'
        imageUrl:
          type: string
          format: uri
          description: Signed URL valid for five minutes.
        altText:
          type: string
        heading:
          type: string
        description:
          type: string

    PublicBannerWrapper:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/PublicBanner'

    PublicService:
      type: object
      required:
        - id
        - slug
        - categorySlug
        - categoryName
        - name
        - shortDescription
        - durationMinutes
        - imageUrl
        - imageAltText
      description: No price fields in public responses (PC-01, November 19, 2026).
      properties:
        id:
          type: string
          format: uuid
          description: Send as serviceId when booking.
        slug:
          type: string
          example: colonoscopy
        categorySlug:
          type: string
          example: digestive-health
        categoryName:
          type: string
          example: Digestive Health
        name:
          type: string
          minLength: 1
          maxLength: 120
          example: Colonoscopy
        shortDescription:
          type: string
          minLength: 1
          maxLength: 300
          example: Camera examination of the large intestine.
        durationMinutes:
          type: integer
          minimum: 5
          maximum: 480
          example: 60
        imageUrl:
          type: [string, 'null']
          format: uri
          description: Signed URL valid for five minutes. Null when the service has no image.
        imageAltText:
          type: [string, 'null']
          minLength: 1
          maxLength: 200
          description: Null exactly when imageUrl is null.
          example: Colonoscopy package poster

    PublicServiceListWrapper:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PublicService'

    PublicDoctorSummary:
      type: object
      required: [slug, fullName, title, imageUrl, imageAltText]
      properties:
        slug:
          type: string
          example: dr-sok
        fullName:
          type: string
          example: Dr. Sok
        title:
          type: string
          minLength: 1
          maxLength: 120
          example: Gastroenterologist
        imageUrl:
          type: [string, 'null']
          format: uri
          description: Signed URL valid for five minutes (DP-06); null when the doctor has no photo.
        imageAltText:
          type: [string, 'null']
          maxLength: 200

    PublicServiceDetail:
      allOf:
        - $ref: '#/components/schemas/PublicService'
        - type: object
          required: [description, preparation, doctors]
          properties:
            description:
              type: string
              minLength: 1
              maxLength: 5000
            preparation:
              type: [string, 'null']
              maxLength: 3000
              description: Null when no preparation is needed.
            doctors:
              type: array
              description: Linked public doctors (PC-06). Information only; reception assigns the doctor.
              items:
                $ref: '#/components/schemas/PublicDoctorSummary'

    PublicServiceDetailWrapper:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/PublicServiceDetail'

    PublicDoctor:
      allOf:
        - $ref: '#/components/schemas/PublicDoctorSummary'
        - type: object
          required: [bio, education, tags, experienceYears, publicationsCount, serviceSlugs]
          description: Every doctor card field (DP-09). Translated values are in the requested language.
          properties:
            bio:
              type: [string, 'null']
              maxLength: 3000
            education:
              type: [string, 'null']
              maxLength: 500
            tags:
              type: array
              maxItems: 5
              description: Empty array when there are none, never null (DP-02).
              items:
                type: string
                minLength: 1
                maxLength: 40
            experienceYears:
              type: [integer, 'null']
              minimum: 0
              description: Current year in Asia/Phnom_Penh minus practiceStartYear; null when not set (DP-03).
            publicationsCount:
              type: [integer, 'null']
              minimum: 0
              maximum: 10000
            serviceSlugs:
              type: array
              items:
                type: string

    PublicDoctorListWrapper:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PublicDoctor'

    PublicDoctorDetail:
      allOf:
        - $ref: '#/components/schemas/PublicDoctor'
        - type: object
          required: [services]
          properties:
            services:
              type: array
              items:
                type: object
                required: [slug, name, shortDescription]
                properties:
                  slug:
                    type: string
                  name:
                    type: string
                  shortDescription:
                    type: string

    PublicDoctorDetailWrapper:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/PublicDoctorDetail'

    DoctorProfileWrite:
      type: object
      required: [slug, practiceStartYear, publicationsCount, translations]
      properties:
        slug:
          type: string
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          minLength: 1
          maxLength: 80
        practiceStartYear:
          type: [integer, 'null']
          minimum: 1950
          description: Up to the current year in Asia/Phnom_Penh (DP-03).
          example: 2010
        publicationsCount:
          type: [integer, 'null']
          minimum: 0
          maximum: 10000
          example: 12
        translations:
          type: array
          minItems: 3
          maxItems: 3
          description: Exactly one entry each for km, en and zh.
          items:
            type: object
            required: [languageCode, title, bio, education, tags]
            properties:
              languageCode:
                $ref: '#/components/schemas/LanguageCode'
              title:
                type: string
                minLength: 1
                maxLength: 120
              bio:
                type: [string, 'null']
                minLength: 1
                maxLength: 3000
              education:
                type: [string, 'null']
                minLength: 1
                maxLength: 500
              tags:
                type: array
                maxItems: 5
                uniqueItems: true
                items:
                  type: string
                  minLength: 1
                  maxLength: 40
              imageAltText:
                type: [string, 'null']
                minLength: 1
                maxLength: 200
                description: Only when the doctor has a photo. Absent or null keeps the saved alt text (DP-08).

    DoctorProfileWrapper:
      type: object
      required: [data]
      properties:
        data:
          allOf:
            - $ref: '#/components/schemas/DoctorProfileWrite'
            - type: object
              required: [doctorId, imageUrl, serviceIds, version]
              properties:
                doctorId:
                  type: string
                  format: uuid
                imageUrl:
                  type: [string, 'null']
                  format: uri
                  description: Signed URL valid for five minutes; null when there is no photo.
                serviceIds:
                  type: array
                  items:
                    type: string
                    format: uuid
                version:
                  type: integer
                  format: int64

    ServiceDoctorsWrite:
      type: object
      required: [doctorIds]
      properties:
        doctorIds:
          type: array
          maxItems: 50
          uniqueItems: true
          items:
            type: string
            format: uuid

    ServiceDoctorsWrapper:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [serviceId, doctorIds]
          properties:
            serviceId:
              type: string
              format: uuid
            doctorIds:
              type: array
              items:
                type: string
                format: uuid

    ServiceStatus:
      type: string
      enum: [ACTIVE, INACTIVE]

    PublicPackage:
      type: object
      required:
        - id
        - slug
        - name
        - shortDescription
        - priceUsd
        - originalPriceUsd
        - durationMinutes
        - imageUrl
        - imageAltText
        - includedServiceSlugs
      description: PK-02, PK-06, November 19, 2026. No bufferMinutes, status or sortOrder.
      properties:
        id:
          type: string
          format: uuid
          description: Send as packageId when booking.
        slug:
          type: string
          example: annual-health-check
        name:
          type: string
          minLength: 1
          maxLength: 120
        shortDescription:
          type: string
          minLength: 1
          maxLength: 300
        priceUsd:
          type: number
          minimum: 0
          multipleOf: 0.01
          example: 120.00
        originalPriceUsd:
          type: [number, 'null']
          multipleOf: 0.01
          description: Price before a promotion, shown crossed out. Greater than priceUsd.
        durationMinutes:
          type: integer
          minimum: 5
          maximum: 480
        imageUrl:
          type: [string, 'null']
          format: uri
          description: Phase 2 (PK-11); null until package images are supported.
        imageAltText:
          type: [string, 'null']
          maxLength: 200
        includedServiceSlugs:
          type: array
          description: ACTIVE included services, in package order (PK-04).
          items:
            type: string

    PublicPackageListWrapper:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PublicPackage'

    PublicPackageIncludedService:
      type: object
      required: [slug, name, shortDescription]
      properties:
        slug:
          type: string
        name:
          type: string
        shortDescription:
          type: string

    PublicPackageDetail:
      allOf:
        - $ref: '#/components/schemas/PublicPackage'
        - type: object
          required: [description, preparation, includedServices, exclusions]
          properties:
            description:
              type: string
              minLength: 1
              maxLength: 5000
            preparation:
              type: [string, 'null']
              maxLength: 3000
              description: Null when no preparation is needed.
            includedServices:
              type: array
              items:
                $ref: '#/components/schemas/PublicPackageIncludedService'
            exclusions:
              type: array
              maxItems: 20
              items:
                type: string
                minLength: 1
                maxLength: 200

    PublicPackageDetailWrapper:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/PublicPackageDetail'

    AdminPackageText:
      type: object
      required: [languageCode, name, shortDescription, description, preparation, exclusions]
      properties:
        languageCode:
          $ref: '#/components/schemas/LanguageCode'
        name:
          type: string
          minLength: 1
          maxLength: 120
        shortDescription:
          type: string
          minLength: 1
          maxLength: 300
        description:
          type: string
          minLength: 1
          maxLength: 5000
        preparation:
          type: [string, 'null']
          minLength: 1
          maxLength: 3000
        exclusions:
          type: array
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 200

    AdminPackageWrite:
      type: object
      required: [slug, priceUsd, originalPriceUsd, durationMinutes, bufferMinutes, sortOrder, includedServiceIds]
      properties:
        slug:
          type: string
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
          minLength: 1
          maxLength: 80
        priceUsd:
          type: number
          minimum: 0
          multipleOf: 0.01
        originalPriceUsd:
          type: [number, 'null']
          multipleOf: 0.01
          description: Null, or greater than priceUsd.
        durationMinutes:
          type: integer
          minimum: 5
          maximum: 480
        bufferMinutes:
          type: integer
          minimum: 0
          maximum: 60
        sortOrder:
          type: integer
          minimum: 0
          maximum: 9999
        includedServiceIds:
          type: array
          minItems: 1
          maxItems: 30
          uniqueItems: true
          description: Existing services (ACTIVE or INACTIVE), in display order (PK-04).
          items:
            type: string
            format: uuid
        translations:
          type: array
          maxItems: 3
          description: Each languageCode at most once. On PUT, languages not sent keep their saved text.
          items:
            $ref: '#/components/schemas/AdminPackageText'

    AdminPackage:
      type: object
      required:
        - id
        - slug
        - status
        - priceUsd
        - originalPriceUsd
        - durationMinutes
        - bufferMinutes
        - sortOrder
        - includedServiceIds
        - imageUrl
        - updatedAt
        - version
        - translations
        - missingLanguages
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        status:
          $ref: '#/components/schemas/ServiceStatus'
        priceUsd:
          type: number
        originalPriceUsd:
          type: [number, 'null']
        durationMinutes:
          type: integer
        bufferMinutes:
          type: integer
        sortOrder:
          type: integer
        includedServiceIds:
          type: array
          items:
            type: string
            format: uuid
        imageUrl:
          type: [string, 'null']
          format: uri
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          description: Same value as the ETag, without quotes.
        translations:
          type: array
          description: Saved languages, ordered km, en, zh.
          items:
            $ref: '#/components/schemas/AdminPackageText'
        missingLanguages:
          type: array
          items:
            $ref: '#/components/schemas/LanguageCode'

    AdminPackageWrapper:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/AdminPackage'

    AdminPackageListWrapper:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AdminPackage'

    AdminServiceText:
      type: object
      required: [languageCode, name, shortDescription]
      properties:
        languageCode:
          $ref: '#/components/schemas/LanguageCode'
        name:
          type: string
          minLength: 1
          maxLength: 120
        shortDescription:
          type: string
          minLength: 1
          maxLength: 300
        description:
          type: [string, 'null']
          minLength: 1
          maxLength: 5000
          description: PC-03. Required in every language before an ACTIVE service can be saved or activated.
        preparation:
          type: [string, 'null']
          minLength: 1
          maxLength: 3000
          description: PC-03. Null when no preparation is needed.
        imageAltText:
          type: [string, 'null']
          maxLength: 200
          description: |
            Alt text of the service image in this language (SI-06). In PUT requests, absent or null
            keeps the saved value; a value is only allowed when the service has an image.

    ServiceImageAltText:
      type: object
      required: [languageCode, imageAltText]
      properties:
        languageCode:
          $ref: '#/components/schemas/LanguageCode'
        imageAltText:
          type: string
          minLength: 1
          maxLength: 200

    AdminService:
      type: object
      required:
        - id
        - slug
        - categorySlug
        - categoryName
        - status
        - durationMinutes
        - bufferMinutes
        - priceUsd
        - originalPriceUsd
        - sortOrder
        - imageUrl
        - updatedAt
        - version
        - translations
        - missingLanguages
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        categorySlug:
          type: string
        categoryName:
          type: string
          description: English category name.
        status:
          $ref: '#/components/schemas/ServiceStatus'
        durationMinutes:
          type: integer
          minimum: 5
          maximum: 480
        bufferMinutes:
          type: integer
          minimum: 0
          maximum: 60
        priceUsd:
          type: [number, 'null']
        originalPriceUsd:
          type: [number, 'null']
        sortOrder:
          type: integer
        imageUrl:
          type: [string, 'null']
          format: uri
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          description: Same value as the ETag, without quotes.
        translations:
          type: array
          description: Saved languages, ordered km, en, zh.
          items:
            $ref: '#/components/schemas/AdminServiceText'
        missingLanguages:
          type: array
          items:
            $ref: '#/components/schemas/LanguageCode'

    AdminServiceWrapper:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/AdminService'

    AdminServiceListWrapper:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AdminService'

    AdminServiceUpdate:
      type: object
      required: [durationMinutes, bufferMinutes, priceUsd, originalPriceUsd, sortOrder]
      properties:
        durationMinutes:
          type: integer
          minimum: 5
          maximum: 480
        bufferMinutes:
          type: integer
          minimum: 0
          maximum: 60
        priceUsd:
          type: [number, 'null']
          minimum: 0
          multipleOf: 0.01
        originalPriceUsd:
          type: [number, 'null']
          multipleOf: 0.01
          description: Null, or greater than priceUsd. Requires priceUsd.
        sortOrder:
          type: integer
          minimum: 0
          maximum: 9999
        translations:
          type: array
          maxItems: 3
          description: Each languageCode at most once. Languages not sent keep their saved text.
          items:
            $ref: '#/components/schemas/AdminServiceText'

    ProblemDetails:
      type: object
      properties:
        type:
          type: string
          example: VALIDATION_ERROR
        title:
          type: string
          example: Bad Request
        status:
          type: integer
          example: 400
        detail:
          type: string
          example: translations[km].heading must be at most 120 characters.
        instance:
          type: string
          example: /api/v1/admin/homepage/banner
        timestamp:
          type: string
          format: date-time
        errors:
          type: array
          description: Field-level details. For TRANSLATION_MISSING, one entry per missing language.
          items:
            type: object
            properties:
              field:
                type: string
                example: translations
              languageCode:
                $ref: '#/components/schemas/LanguageCode'

    AppointmentStatus:
      type: string
      enum: [PENDING, CONFIRMED, REJECTED, ARRIVED, IN_PROGRESS, COMPLETED]

    BookingPeriodAvailability:
      type: object
      required: [code, startTime, endTime, available]
      properties:
        code:
          type: string
          example: MORNING
        startTime:
          type: string
          example: '08:00'
        endTime:
          type: string
          example: '12:00'
        available:
          type: boolean

    BookingSlot:
      type: object
      required: [startAt, endAt]
      properties:
        startAt:
          type: string
          format: date-time
          example: '2026-11-20T14:00:00+07:00'
        endAt:
          type: string
          format: date-time
          description: Service end; availability also accounts for the buffer after this time.
          example: '2026-11-20T14:30:00+07:00'

    BookingSlots:
      type: object
      required: [date, timeZone, slots]
      properties:
        date:
          type: string
          format: date
        timeZone:
          type: string
          const: Asia/Phnom_Penh
        slots:
          type: array
          items:
            $ref: '#/components/schemas/BookingSlot'

    BookingRequest:
      type: object
      required: [preferredDate, language, patient]
      description: |
        Exactly one of serviceId or packageId (PK-07), and exactly one of preferredPeriod or
        preferredStartTime. Package requests must use preferredPeriod. preferredDoctorSlug is
        allowed with serviceId only (PD-02).
      allOf:
        - oneOf:
            - required: [serviceId]
              not:
                required: [packageId]
            - required: [packageId, preferredPeriod]
              not:
                anyOf:
                  - required: [serviceId]
                  - required: [preferredStartTime]
        - oneOf:
            - required: [preferredPeriod]
              not:
                required: [preferredStartTime]
            - required: [preferredStartTime]
              not:
                required: [preferredPeriod]
      properties:
        serviceId:
          type: string
          format: uuid
        packageId:
          type: string
          format: uuid
          description: An ACTIVE package's id (PK-07).
        preferredDate:
          type: string
          format: date
          description: Today to today + 60 days in clinic time (AP-02).
        preferredPeriod:
          type: string
          example: MORNING
        preferredStartTime:
          type: string
          pattern: '^(?:[01][0-9]|2[0-3]):(?:00|30)$'
          description: Exact requested start, HH:mm in Asia/Phnom_Penh. Omit preferredPeriod.
          example: '14:30'
        preferredDoctorSlug:
          type: [string, 'null']
          maxLength: 80
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
          description: |
            Optional, non-binding preferred doctor (PD-01). Must be a public doctor linked to
            serviceId (PD-02): unknown or non-public returns 404 DOCTOR_NOT_FOUND; not linked, or
            sent with packageId, returns 400 VALIDATION_ERROR. Reception may assign any active
            doctor on confirm (PD-06). Absent or null means no preference.
          example: dr-sok
        language:
          $ref: '#/components/schemas/LanguageCode'
        patient:
          type: object
          required: [fullName, phone]
          properties:
            fullName:
              type: string
              maxLength: 120
              example: Sok Dara
            phone:
              type: string
              description: Any common format; stored as E.164 (AP-04).
              example: 012 345 678
            email:
              type: [string, 'null']
              maxLength: 254
        notes:
          type: [string, 'null']
          maxLength: 500

    BookingConfirmation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        reference:
          type: string
          example: SK-20261120-0007
        status:
          $ref: '#/components/schemas/AppointmentStatus'
        preferredDate:
          type: string
          format: date
        preferredPeriod:
          type: string
          example: MORNING

        preferredStartTime:
          type: [string, 'null']
          pattern: '^(?:[01][0-9]|2[0-3]):(?:00|30)$'
          description: Original exact request in clinic time; null for legacy period requests.
        telegramLinkUrl:
          type: [string, 'null']
          format: uri
          description: |
            PT-02. Opens the clinic bot to opt in to Telegram updates for this booking.
            Single use, expires 24 hours after booking; the same URL on an idempotent replay.
            Null when patient updates are disabled (PT-12).
          example: https://t.me/Sokhasaclinic_bot?start=Qm9va2luZ0xpbmtDb2RlRXhhbXBsZTEyMzQ1Njc4OTA

    AppointmentListItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        reference:
          type: string
          example: SK-20261120-0007
        status:
          $ref: '#/components/schemas/AppointmentStatus'
        patientName:
          type: string
        patientPhone:
          type: string
          example: '+85512345678'
        bookingType:
          type: string
          enum: [SERVICE, PACKAGE]
          description: PK-10.
        serviceName:
          type: [string, 'null']
          description: In English, the staff language. Null for package appointments.
        packageId:
          type: [string, 'null']
          format: uuid
          description: Null for service appointments (PK-10).
        packageName:
          type: [string, 'null']
          description: In English. Null for service appointments (PK-10).
        preferredDate:
          type: string
          format: date
        preferredPeriod:
          type: string
        preferredDoctorName:
          type: [string, 'null']
          description: Current fullName of the patient's preferred doctor (PD-07); null when none.
        doctorName:
          type: [string, 'null']
        startAt:
          type: [string, 'null']
          format: date-time
          example: '2026-11-20T09:30:00+07:00'
        createdAt:
          type: string
          format: date-time

        preferredStartTime:
          type: [string, 'null']
          pattern: '^(?:[01][0-9]|2[0-3]):(?:00|30)$'
          description: Original exact request in clinic time; null for legacy period requests.

    AppointmentDetail:
      allOf:
        - $ref: '#/components/schemas/AppointmentListItem'
        - type: object
          properties:
            serviceId:
              type: [string, 'null']
              format: uuid
              description: Null for package appointments (PK-10).
            patientEmail:
              type: [string, 'null']
            language:
              $ref: '#/components/schemas/LanguageCode'
            notes:
              type: [string, 'null']
            durationMinutes:
              type: integer
            bufferMinutes:
              type: integer
            preferredDoctorId:
              type: [string, 'null']
              format: uuid
              description: The patient's preferred doctor (PD-03, PD-07); never overwritten; null when none.
            patientTelegramConnected:
              type: boolean
              description: PT-10. True while the patient has an active Telegram subscription for this booking.
            doctorId:
              type: [string, 'null']
              format: uuid
            endAt:
              type: [string, 'null']
              format: date-time
            updatedAt:
              type: string
              format: date-time

    PageInfo:
      type: object
      properties:
        number:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
        totalPages:
          type: integer

    StatusChange:
      type: object
      properties:
        fromStatus:
          oneOf:
            - $ref: '#/components/schemas/AppointmentStatus'
            - type: 'null'
        toStatus:
          $ref: '#/components/schemas/AppointmentStatus'
        actorType:
          type: string
          enum: [GUEST, STAFF]
        actorName:
          type: [string, 'null']
        reason:
          type: [string, 'null']
        changedAt:
          type: string
          format: date-time

    ConfirmRequest:
      type: object
      required: [doctorId, date, startTime]
      properties:
        doctorId:
          type: string
          format: uuid
        date:
          type: string
          format: date
          description: Local clinic date; may differ from the patient's preference.
        startTime:
          type: string
          example: '09:30'
          description: Local clinic time.
        durationMinutes:
          type: integer
          minimum: 5
          maximum: 480
          description: Defaults to the duration copied from the service (BK-06).

    RejectRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
