openapi: 3.1.0
info:
  title: Sokhasa Clinic API
  version: 1.0.0
  description: REST API specification for Sokhasa Clinic Appointment Booking and CMS. Interactive reference rendered via Scalar.
servers:
  - url: /api/v1
    description: Base API v1 endpoint
paths:
  /health:
    get:
      tags:
        - System
      operationId: getHealth
      summary: Deployment and database health check
      description: Returns HTTP 200 when backend and database are healthy. Returns 503 when down.
      responses:
        '200':
          description: Application and database are healthy
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: UP
        '503':
          description: Service Unavailable

  /clinic/info:
    get:
      tags:
        - Public Clinic
      operationId: getClinicInfo
      summary: Public clinic name and welcome message
      responses:
        '200':
          description: Clinic information
          content:
            application/json:
              schema:
                type: object
                required: [name, message]
                properties:
                  name:
                    type: string
                    example: Clinic Sokhasa
                  message:
                    type: string
                    example: Welcome to Clinic Sokhasa.

  /admin/homepage/banner:
    get:
      tags:
        - Admin Homepage Banner
      security:
        - BearerAuth: []
      operationId: getAdminHomepageBanner
      summary: Get the current homepage hero banner
      description: |
        Returns the first slide of the public homepage hero photo slider in every saved language,
        and its strong ETag. Before the first publish imageUrl, fileName and publishedAt are null,
        translations is empty, missingLanguages is ["km","en","zh"] and the ETag is "0".
      responses:
        '200':
          description: Current banner
          headers:
            ETag:
              description: Strong revision tag to send in If-Match. "0" before the first publish.
              schema:
                type: string
                example: '"3"'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminBannerWrapper'
        '401':
          description: Missing or invalid bearer token
        '403':
          description: Caller lacks the ADMIN role
    patch:
      tags:
        - Admin Homepage Banner
      security:
        - BearerAuth: []
      operationId: publishHomepageBanner
      summary: Publish or update the homepage hero banner
      description: |
        Publishes immediately. Send an image, translations, or both. Languages not sent keep their
        saved text. A replacement image requires translations for km, en and zh in the same request.
        After the request, every language (km, en, zh) must have text, otherwise the request returns
        409 TRANSLATION_MISSING and nothing changes; the first publish therefore needs the image and
        all three translations. The live banner switches only after the image upload and the
        database update both succeed.
      parameters:
        - name: If-Match
          in: header
          required: true
          description: ETag from the latest GET or PATCH response.
          schema:
            type: string
            example: '"3"'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image:
                  type: string
                  format: binary
                  description: JPEG, PNG, or WebP up to 5 MiB and 40 million pixels.
                translations:
                  type: array
                  description: Sent as an application/json part. Each languageCode at most once.
                  items:
                    $ref: '#/components/schemas/BannerText'
            encoding:
              translations:
                contentType: application/json
      responses:
        '200':
          description: Banner published
          headers:
            ETag:
              description: New strong revision tag.
              schema:
                type: string
                example: '"4"'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminBannerWrapper'
        '400':
          description: |
            Invalid or duplicate languageCode, missing or invalid text field, malformed translations
            JSON, empty request, new image without all three translations, first publish without an
            image, or undecodable image (VALIDATION_ERROR)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Missing or invalid bearer token
        '403':
          description: Caller lacks the ADMIN role
        '409':
          description: A required language would be missing after the request (TRANSLATION_MISSING)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '412':
          description: If-Match does not match the current banner revision (VERSION_MISMATCH)
        '413':
          description: Image exceeds 5 MiB (IMAGE_TOO_LARGE)
        '415':
          description: Image is not JPEG, PNG, or WebP (UNSUPPORTED_IMAGE)
        '428':
          description: If-Match header is missing (VERSION_REQUIRED)
        '503':
          description: Media storage unavailable (STORAGE_UNAVAILABLE)

  /public/homepage/banner:
    get:
      tags:
        - Public Homepage Banner
      operationId: getPublicHomepageBanner
      summary: Get the published homepage hero banner in one language
      description: |
        imageUrl is a signed Cloudflare R2 URL that expires after five minutes, so responses are
        sent with Cache-Control no-store. There is no fallback to another language.
      parameters:
        - name: lang
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/LanguageCode'
      responses:
        '200':
          description: Published banner in the requested language
          headers:
            Content-Language:
              description: The language served, equal to lang.
              schema:
                $ref: '#/components/schemas/LanguageCode'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicBannerWrapper'
        '400':
          description: lang is missing or not km, en or zh (VALIDATION_ERROR)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: |
            Nothing published yet, or no text in the requested language (BANNER_NOT_FOUND); use the
            bundled first slide

  /public/services:
    get:
      tags:
        - Public Services
      operationId: listPublicServices
      summary: List active bookable services in one language
      description: |
        Approved November 18, 2026. Returns every ACTIVE service, ordered by category sortOrder, service sortOrder, then slug.
        No paging and no fallback to another language. imageUrl is a signed Cloudflare R2 URL that
        expires after five minutes, so responses are sent with Cache-Control no-store.
      parameters:
        - name: lang
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/LanguageCode'
      responses:
        '200':
          description: Active services in the requested language; an empty array when there are none
          headers:
            Content-Language:
              description: The language served, equal to lang.
              schema:
                $ref: '#/components/schemas/LanguageCode'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicServiceListWrapper'
        '400':
          description: lang is missing or not km, en or zh (VALIDATION_ERROR)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /public/services/{slug}:
    get:
      tags:
        - Public Services
      operationId: getPublicService
      summary: Service detail with description, preparation and related doctors
      description: PC-02 to PC-06, November 19, 2026. No price fields. Cache-Control no-store.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: lang
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/LanguageCode'
      responses:
        '200':
          description: The active service in the requested language
          headers:
            Content-Language:
              schema:
                $ref: '#/components/schemas/LanguageCode'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicServiceDetailWrapper'
        '400':
          description: lang is missing or invalid (VALIDATION_ERROR)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Unknown or inactive service (SERVICE_NOT_FOUND)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /public/doctors:
    get:
      tags:
        - Public Doctors
      operationId: listPublicDoctors
      summary: List public doctor profiles in one language
      description: PC-04 and DP-09, November 19, 2026. ACTIVE doctors with a slug and all three profile languages, with every card field. Cache-Control no-store.
      parameters:
        - name: lang
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/LanguageCode'
      responses:
        '200':
          description: Public doctors; an empty array when there are none
          headers:
            Content-Language:
              schema:
                $ref: '#/components/schemas/LanguageCode'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicDoctorListWrapper'
        '400':
          description: lang is missing or invalid (VALIDATION_ERROR)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /public/doctors/{slug}:
    get:
      tags:
        - Public Doctors
      operationId: getPublicDoctor
      summary: One public doctor profile with linked services
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: lang
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/LanguageCode'
      responses:
        '200':
          description: The doctor profile in the requested language
          headers:
            Content-Language:
              schema:
                $ref: '#/components/schemas/LanguageCode'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicDoctorDetailWrapper'
        '400':
          description: lang is missing or invalid (VALIDATION_ERROR)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Unknown or non-public doctor (DOCTOR_NOT_FOUND)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /admin/doctors/{id}/profile:
    get:
      tags: [Doctor Management]
      security:
        - BearerAuth: []
      operationId: getDoctorProfile
      summary: Read a doctor's profile for editing
      description: ADMIN only (DP-12). slug is null and translations is empty until a profile is saved.
      parameters:
        - $ref: '#/components/parameters/DoctorId'
      responses:
        '200':
          description: The doctor's profile in every saved language
          headers:
            ETag:
              $ref: '#/components/headers/ServiceETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoctorProfileWrapper'
        '401':
          description: Sign-in required
        '403':
          description: Caller lacks the ADMIN role
        '404':
          description: Unknown doctor (DOCTOR_NOT_FOUND)
    put:
      tags: [Doctor Management]
      security:
        - BearerAuth: []
      operationId: updateDoctorProfile
      summary: Set a doctor's public profile and card fields
      description: ADMIN only (PC-05, PC-07, DP-01 to DP-04, DP-08). Increases the doctor's version.
      parameters:
        - $ref: '#/components/parameters/DoctorId'
        - $ref: '#/components/parameters/ServiceIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DoctorProfileWrite'
      responses:
        '200':
          description: Saved profile
          headers:
            ETag:
              $ref: '#/components/headers/ServiceETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoctorProfileWrapper'
        '400':
          description: Invalid slug or translations (VALIDATION_ERROR)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Sign-in required
        '403':
          description: Caller lacks the ADMIN role
        '404':
          description: Unknown doctor (DOCTOR_NOT_FOUND)
        '409':
          description: Slug used by another doctor (DOCTOR_SLUG_TAKEN)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '412':
          description: If-Match is not the current version (VERSION_MISMATCH)
        '428':
          description: If-Match header is missing (VERSION_REQUIRED)

  /admin/doctors/{id}/image:
    parameters:
      - $ref: '#/components/parameters/DoctorId'
    put:
      tags: [Doctor Management]
      security:
        - BearerAuth: []
      operationId: putDoctorImage
      summary: Set or replace a doctor photo with alt text in every language
      description: |
        ADMIN only (DP-06, DP-07). Same image rules as service images (SI-02, SI-05). The doctor
        needs a saved profile in km, en and zh first. The new photo is live only after the upload
        and the database update both succeed; a replaced photo is deleted from storage afterwards.
      parameters:
        - $ref: '#/components/parameters/ServiceIfMatch'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image, altTexts]
              properties:
                image:
                  type: string
                  format: binary
                  description: JPEG, PNG, or WebP up to 5 MiB and 40 million pixels.
                altTexts:
                  type: array
                  minItems: 3
                  maxItems: 3
                  description: Sent as an application/json part. One entry per km, en and zh.
                  items:
                    $ref: '#/components/schemas/ServiceImageAltText'
            encoding:
              altTexts:
                contentType: application/json
      responses:
        '200':
          description: Saved profile with the new photo
          headers:
            ETag:
              $ref: '#/components/headers/ServiceETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoctorProfileWrapper'
        '400':
          description: Missing parts, bad alt texts, or undecodable image (VALIDATION_ERROR)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Sign-in required
        '403':
          description: Caller lacks the ADMIN role
        '404':
          description: Unknown doctor (DOCTOR_NOT_FOUND)
        '409':
          description: Doctor lacks a profile in km, en or zh (TRANSLATION_MISSING)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '412':
          description: If-Match is not the current version (VERSION_MISMATCH)
        '413':
          description: Image exceeds 5 MiB (IMAGE_TOO_LARGE)
        '415':
          description: Image is not JPEG, PNG, or WebP (UNSUPPORTED_IMAGE)
        '428':
          description: If-Match header is missing (VERSION_REQUIRED)
        '503':
          description: Media storage unavailable (STORAGE_UNAVAILABLE)
    delete:
      tags: [Doctor Management]
      security:
        - BearerAuth: []
      operationId: deleteDoctorImage
      summary: Remove a doctor photo and its alt text
      description: The website shows its fallback picture (DP-11). Deleting when there is no photo changes nothing.
      parameters:
        - $ref: '#/components/parameters/ServiceIfMatch'
      responses:
        '200':
          description: Saved profile without a photo
          headers:
            ETag:
              $ref: '#/components/headers/ServiceETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoctorProfileWrapper'
        '401':
          description: Sign-in required
        '403':
          description: Caller lacks the ADMIN role
        '404':
          description: Unknown doctor (DOCTOR_NOT_FOUND)
        '412':
          description: If-Match is not the current version (VERSION_MISMATCH)
        '428':
          description: If-Match header is missing (VERSION_REQUIRED)

  /admin/services/{id}/doctors:
    put:
      tags:
        - Admin Services
      security:
        - BearerAuth: []
      operationId: replaceServiceDoctors
      summary: Replace the doctors linked to a service
      description: ADMIN only (PC-06). Links are information only and do not affect booking or doctor assignment.
      parameters:
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/ServiceIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceDoctorsWrite'
      responses:
        '200':
          description: Saved links
          headers:
            ETag:
              $ref: '#/components/headers/ServiceETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceDoctorsWrapper'
        '400':
          description: Duplicate or too many doctorIds (VALIDATION_ERROR)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Sign-in required
        '403':
          description: Caller lacks the ADMIN role
        '404':
          description: Unknown service (SERVICE_NOT_FOUND) or doctor (DOCTOR_NOT_FOUND)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '412':
          description: If-Match is not the current version (VERSION_MISMATCH)
        '428':
          description: If-Match header is missing (VERSION_REQUIRED)

  /admin/services:
    get:
      tags:
        - Admin Services
      security:
        - BearerAuth: []
      operationId: listAdminServices
      summary: List every service for editing
      description: |
        Approved November 18, 2026.
        Active and inactive services with admin fields and every saved language, in public list order.
      responses:
        '200':
          description: All services
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminServiceListWrapper'
        '401':
          description: Missing or invalid bearer token
        '403':
          description: Caller lacks the ADMIN role

  /admin/services/{id}:
    parameters:
      - $ref: '#/components/parameters/ServiceId'
    get:
      tags:
        - Admin Services
      security:
        - BearerAuth: []
      operationId: getAdminService
      summary: Get one service for editing
      responses:
        '200':
          description: The service and its strong ETag
          headers:
            ETag:
              $ref: '#/components/headers/ServiceETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminServiceWrapper'
        '401':
          description: Missing or invalid bearer token
        '403':
          description: Caller lacks the ADMIN role
        '404':
          $ref: '#/components/responses/ServiceNotFound'
    put:
      tags:
        - Admin Services
      security:
        - BearerAuth: []
      operationId: updateAdminService
      summary: Update a service's text, duration, buffer, prices and order
      description: |
        Languages not sent keep their saved text. An ACTIVE service must still have km, en and zh
        afterwards, otherwise 409 TRANSLATION_MISSING and nothing changes. Slug, category, status
        and image are not changed here.
      parameters:
        - $ref: '#/components/parameters/ServiceIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminServiceUpdate'
      responses:
        '200':
          $ref: '#/components/responses/AdminServiceSaved'
        '400':
          $ref: '#/components/responses/ServiceValidationError'
        '401':
          description: Missing or invalid bearer token
        '403':
          description: Caller lacks the ADMIN role
        '404':
          $ref: '#/components/responses/ServiceNotFound'
        '409':
          $ref: '#/components/responses/ServiceTranslationMissing'
        '412':
          description: If-Match is not the current version (VERSION_MISMATCH)
        '428':
          description: If-Match header is missing (VERSION_REQUIRED)

  /admin/services/{id}/activate:
    parameters:
      - $ref: '#/components/parameters/ServiceId'
    patch:
      tags:
        - Admin Services
      security:
        - BearerAuth: []
      operationId: activateAdminService
      summary: Make a service public and bookable
      description: Requires km, en and zh text. Activating an active service changes nothing.
      parameters:
        - $ref: '#/components/parameters/ServiceIfMatch'
      responses:
        '200':
          $ref: '#/components/responses/AdminServiceSaved'
        '401':
          description: Missing or invalid bearer token
        '403':
          description: Caller lacks the ADMIN role
        '404':
          $ref: '#/components/responses/ServiceNotFound'
        '409':
          $ref: '#/components/responses/ServiceTranslationMissing'
        '412':
          description: If-Match is not the current version (VERSION_MISMATCH)
        '428':
          description: If-Match header is missing (VERSION_REQUIRED)

  /admin/services/{id}/deactivate:
    parameters:
      - $ref: '#/components/parameters/ServiceId'
    patch:
      tags:
        - Admin Services
      security:
        - BearerAuth: []
      operationId: deactivateAdminService
      summary: Hide a service from the website and booking form
      description: Existing appointments keep the service. Deactivating an inactive service changes nothing.
      parameters:
        - $ref: '#/components/parameters/ServiceIfMatch'
      responses:
        '200':
          $ref: '#/components/responses/AdminServiceSaved'
        '401':
          description: Missing or invalid bearer token
        '403':
          description: Caller lacks the ADMIN role
        '404':
          $ref: '#/components/responses/ServiceNotFound'
        '412':
          description: If-Match is not the current version (VERSION_MISMATCH)
        '428':
          description: If-Match header is missing (VERSION_REQUIRED)

  /admin/services/{id}/image:
    parameters:
      - $ref: '#/components/parameters/ServiceId'
    put:
      tags:
        - Admin Services
      security:
        - BearerAuth: []
      operationId: putAdminServiceImage
      summary: Set or replace a service image with alt text in every language
      description: |
        Approved November 18, 2026 (SI-01 to SI-07). The service needs its name and description in
        km, en and zh first. The new image is live only after the upload and the database update
        both succeed; a replaced image is deleted from storage afterwards.
      parameters:
        - $ref: '#/components/parameters/ServiceIfMatch'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image, altTexts]
              properties:
                image:
                  type: string
                  format: binary
                  description: JPEG, PNG, or WebP up to 5 MiB and 40 million pixels.
                altTexts:
                  type: array
                  minItems: 3
                  maxItems: 3
                  description: Sent as an application/json part. One entry per km, en and zh.
                  items:
                    $ref: '#/components/schemas/ServiceImageAltText'
            encoding:
              altTexts:
                contentType: application/json
      responses:
        '200':
          $ref: '#/components/responses/AdminServiceSaved'
        '400':
          $ref: '#/components/responses/ServiceValidationError'
        '401':
          description: Missing or invalid bearer token
        '403':
          description: Caller lacks the ADMIN role
        '404':
          $ref: '#/components/responses/ServiceNotFound'
        '409':
          $ref: '#/components/responses/ServiceTranslationMissing'
        '412':
          description: If-Match is not the current version (VERSION_MISMATCH)
        '413':
          description: Image exceeds 5 MiB (IMAGE_TOO_LARGE)
        '415':
          description: Image is not JPEG, PNG, or WebP (UNSUPPORTED_IMAGE)
        '428':
          description: If-Match header is missing (VERSION_REQUIRED)
        '503':
          description: Media storage unavailable (STORAGE_UNAVAILABLE)
    delete:
      tags:
        - Admin Services
      security:
        - BearerAuth: []
      operationId: deleteAdminServiceImage
      summary: Remove a service image and its alt text
      description: The website falls back to its bundled picture. Deleting when there is no image changes nothing.
      parameters:
        - $ref: '#/components/parameters/ServiceIfMatch'
      responses:
        '200':
          $ref: '#/components/responses/AdminServiceSaved'
        '401':
          description: Missing or invalid bearer token
        '403':
          description: Caller lacks the ADMIN role
        '404':
          $ref: '#/components/responses/ServiceNotFound'
        '412':
          description: If-Match is not the current version (VERSION_MISMATCH)
        '428':
          description: If-Match header is missing (VERSION_REQUIRED)

  /public/packages:
    get:
      tags: [Public Packages]
      operationId: listPublicPackages
      summary: List active packages with prices in one language
      description: PK-02, PK-06, PK-12, November 19, 2026. No fallback language. Cache-Control no-store.
      parameters:
        - name: lang
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/LanguageCode'
      responses:
        '200':
          description: Active packages; an empty array when there are none
          headers:
            Content-Language:
              schema:
                $ref: '#/components/schemas/LanguageCode'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicPackageListWrapper'
        '400':
          description: lang is missing or invalid (VALIDATION_ERROR)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /public/packages/{slug}:
    get:
      tags: [Public Packages]
      operationId: getPublicPackage
      summary: Package detail with price, included services, exclusions and preparation
      description: PK-04 to PK-06, November 19, 2026. Cache-Control no-store.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: lang
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/LanguageCode'
      responses:
        '200':
          description: The active package in the requested language
          headers:
            Content-Language:
              schema:
                $ref: '#/components/schemas/LanguageCode'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicPackageDetailWrapper'
        '400':
          description: lang is missing or invalid (VALIDATION_ERROR)
          content:
            application/problem+json:
              schema:
