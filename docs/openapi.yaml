            schema:
              $ref: '#/components/schemas/ConfirmRequest'
      responses:
        '200':
          $ref: '#/components/responses/AppointmentSaved'
        '400':
          $ref: '#/components/responses/AppointmentValidationError'
        '404':
          description: APPOINTMENT_NOT_FOUND or DOCTOR_NOT_FOUND
        '409':
          description: INVALID_TRANSITION or DOCTOR_UNAVAILABLE
        '412':
          description: If-Match is not the current version (VERSION_MISMATCH)
        '428':
